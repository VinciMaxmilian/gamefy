name: Catalog sync
# Runs offline (not on Vercel: serverless time limits are too short for rate-limited APIs).
# Add repository secrets: DATABASE_URL (Supabase transaction pooler), IGDB_CLIENT_ID, IGDB_CLIENT_SECRET,
# GEMINI_API_KEY (optional), STEAM_WEB_API_KEY (optional).
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job"
        type: choice
        options: [igdb, steam, prices, steam-changed]
        default: igdb
  schedule:
    - cron: "17 4 * * *"      # daily: prices + changed Steam apps

permissions:
  contents: read

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
      IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Manual job
        if: github.event_name == 'workflow_dispatch'
        run: python -m scripts.sync ${{ inputs.job }}
      - name: Daily refresh
        if: github.event_name == 'schedule'
        run: |
          python -m scripts.sync steam-changed --since-hours 30
          python -m scripts.sync prices --limit 150
