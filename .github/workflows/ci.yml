name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: gamefy_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:dev@localhost:5432/gamefy_dev
      PGPASSWORD: dev
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Database schema (Supabase stand-ins + migrations)
        run: |
          psql -h localhost -U postgres -d gamefy_dev -v ON_ERROR_STOP=1 -q -f scripts/local_bootstrap.sql
          psql -h localhost -U postgres -d gamefy_dev -v ON_ERROR_STOP=1 -q -f ../supabase/migrations/0001_init.sql
          psql -h localhost -U postgres -d gamefy_dev -v ON_ERROR_STOP=1 -q -f ../supabase/migrations/0002_store_links.sql
      - name: Seed demo catalog (offline embedder)
        run: python -m scripts.seed
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
